site_name: Gossamer
site_url: https://danpozmanter.github.io/gossamer/docs/
site_description: A goroutine-powered, fast-compiling systems language with Rust-flavoured syntax and automatic, pause-free memory management.
site_author: Gossamer contributors
repo_url: https://github.com/danpozmanter/gossamer
repo_name: danpozmanter/gossamer
# `edit_uri` intentionally unset — the Material theme already surfaces
# the repository via the top-right repo link injected from `repo_url`.
edit_uri: ""

docs_dir: docs_src
site_dir: docs

theme:
  name: material
  logo: img/GossamerLogo.png
  favicon: img/GossamerLogo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

hooks:
  - mkdocs_hooks.py

nav:
  - Home: index.md
  - Install: install.md
  - Running: running.md
  - Syntax: syntax.md
  - Memory model: memory.md
  - Writing libraries: libraries.md
  - Standard library:
      - Overview: stdlib.md
      - Prelude (no imports): prelude.md
      - Method support: method_support.md
      - Coverage matrix: stdlib_coverage.md
  - Toolchain:
      - Overview: toolchain.md
      - Lints: toolchain/lints.md
      - Diagnostics: toolchain/diagnostics.md
  - Examples: examples.md
  - Production:
      - Deployment: deployment.md
      - Codegen ABI: codegen_abi.md
  - Migrating:
      - From Rust: migration/rust.md
      - From Go: migration/go.md
      - From Python: migration/python.md
      - From F#: migration/fsharp.md
      - From Kotlin: migration/kotlin.md
  - Design notes:
      - Diagnostics style: design/diagnostics.md
      - Runtime internals: design/runtime.md
      - Self-hosting study: design/selfhosting.md
  - Skill card: skill_card.md
  - Security: security.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs_src
      check_paths: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

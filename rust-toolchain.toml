[toolchain]
# `profile = "minimal"` keeps the component set deterministic
# (rustc + rust-std + the two explicit components below) so that
# nested `build.rs` cargo invocations can't trigger a rust-src or
# rust-docs auto-install from a runner image's default profile —
# parallel rustup syncs race on the partial-download rename.
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt", "clippy"]

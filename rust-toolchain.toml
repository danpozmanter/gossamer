[toolchain]
# Conscious lock — bump deliberately, not via `stable` drift.
#
# `profile = "minimal"` is LOAD-BEARING for CI. Without it,
# rustup-the-shim (invoked by `cargo` via `$RUSTC`) reads this
# file, sees a channel + components list but no profile, and
# falls back to the *user-default* profile to decide which
# components SHOULD be installed. GitHub Actions runner images
# set the user-default to `complete`, which lists rust-src. The
# shim then races against every other concurrent `rustc`
# invocation (parent cargo + nested `build.rs` cargo) trying to
# download rust-src — one of them dies with "could not rename
# 'downloaded' .partial" (Linux) or "detected conflict:
# rust-src Cargo.lock" (macOS / Windows, the runner image left
# a half-installed rust-src behind from a previous stable run).
# Locking the profile here tells rustup the project wants
# *only* minimal + the components below, so it stops auto-
# installing rust-src and the race goes away.
#
# CI must call `dtolnay/rust-toolchain@1.95.0` (which itself
# installs with `--profile minimal`) so its install and this
# file agree, and `rustup set profile minimal` must run in CI
# before any cargo invocation so the user-default profile is
# pinned too — defense in depth against future rustup versions
# that ignore the file's profile.
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt", "clippy"]

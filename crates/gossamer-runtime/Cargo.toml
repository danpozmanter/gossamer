[package]
name = "gossamer-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Runtime support library linked into every Gossamer program."

[lib]
crate-type = ["staticlib", "rlib"]

# The runtime crate is unsafe by design — its C-ABI surface
# (`#[no_mangle] extern "C"` functions accepting raw pointers)
# is unsafe at every entry. Override the workspace `deny` to
# `allow` rather than annotate every fn individually.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
unreadable_literal = "allow"
format_push_string = "allow"
collapsible_if = "allow"

[dependencies]
itoa = "1"
parking_lot = { workspace = true }
serde_json = { workspace = true }
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
flate2 = "1"
rustc-hash = "2"
signal-hook = { workspace = true }
gossamer-gc = { workspace = true }
libloading = "0.8"
crossbeam-deque = { workspace = true }
crossbeam-utils = { workspace = true }
mio = { workspace = true }
gossamer-coro = { workspace = true }
gossamer-pkg = { workspace = true }
# `gos_rt_http_stream` uses ureq for the wire request so the
# compiled tier matches the interp's `http::stream` semantics.
# Same feature set as gossamer-std (TLS via rustls, gzip, cookies)
# for parity with `gos run`.
ureq = { version = "3", features = ["cookies"] }

# HTTP/2 server compiled into libgossamer_runtime.a so
# `http2::bind_and_run_h2c` works under `gos build`. Tokio is
# pulled in for its `io-util` trait surface only (AsyncRead /
# AsyncWrite) — no runtime, no reactor; the goroutine scheduler
# drives futures via [`crate::http2_server::drive`].
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["io-util"] }
futures-core = { version = "0.3", default-features = false }
futures-task = { version = "0.3", default-features = false, features = ["alloc"] }
pin-project-lite = "0.2"

# UUID generation (`std::uuid` compiled-tier helpers).
uuid = { version = "1", features = ["v4", "v7"] }

# Unicode tables (`std::unicode` compiled-tier helpers). Same
# crates as gossamer-std so the property data is single-sourced
# (Unicode 16 via unicode-rs).
unicode-properties = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

# User-facing TOML (`std::encoding::toml` compiled-tier helpers).
toml = "0.8"

# Media type parsing (`std::mime` compiled-tier helpers).
mime = "0.3"
mime_guess = "2"

# CSV codec (`std::encoding::csv` compiled-tier helpers).
csv = "1"

# YAML codec — already used by gossamer-std; needed in runtime for
# auto-derive helpers.
serde_yaml = "0.9"
serde = { workspace = true }
quick-xml = "0.37"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# POSIX user / group lookup for `std::os::user` compiled-tier helpers.
nix = { version = "0.29", default-features = false, features = ["user"] }

# Audit M21: Windows preemption uses QueueUserAPC. `windows-sys`
# is the lighter-weight binding (compared to `winapi`) and is
# already a transitive dependency via `mio` / `socket2`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

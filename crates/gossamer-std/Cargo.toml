[package]
name = "gossamer-std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Standard library for the Gossamer language."

[lints]
workspace = true

# Gossamer standard library modules are NEVER feature-gated. Every
# module in this crate is part of the language surface and always
# compiled. Consumers depend on `gossamer-std` plain - no feature
# selection - so that a script using `std::tls` or `std::crypto`
# always works regardless of the host build.

[dependencies]
gossamer-pkg = { workspace = true }
gossamer-runtime = { workspace = true }
gossamer-sched = { workspace = true }
gossamer-coro = { workspace = true }
gossamer-template = { workspace = true }
gossamer-ws = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
mio = { workspace = true }
signal-hook = { workspace = true }
crossbeam-channel = { workspace = true }
# socket2 provides SO_KEEPALIVE access not exposed by std::net.
socket2 = "0.5"
# backtrace powers `std::runtime::caller` / `std::runtime::stack`
# resolving function names + file/line via DWARF when available.
backtrace = "0.3"

# Regular expressions (`std::regex`).
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

# TLS surface (`std::tls`). Rustls + bundled Mozilla roots.
# `tokio-rustls` provides the AsyncRead/AsyncWrite bridge used by
# the ALPN-dispatching HTTP/2 server path; only its trait wrapping
# is consumed (no tokio runtime).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Compression (`std::compress::{gzip,flate,zlib,zstd}` + `std::compress::bzip2`).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# `static` compiles the bundled libbz2 C source into the archive instead of
# dynamically linking the system `-lbz2`. Without it, macOS resolves bzip2
# via pkg-config to the SDK's libbz2 and a `gos build` link (which does not
# pass `-lbz2`) fails with undefined `_BZ2_*` symbols; bundling keeps the
# runtime self-contained on every platform.
bzip2 = { version = "0.5", features = ["static"] }
zstd = "0.13"

# File-system watching (`std::fs::watch`), memory mapping
# (`std::fs::mmap`), and advisory file locks (`std::fs::lock`).
notify = "8"
memmap2 = "0.9"
fs4 = { version = "1.1", features = ["sync"] }

# RSA verify / sign for `std::jwt` (RS256 / RS384 / RS512). `ring`
# is the audited constant-time choice; the `rsa` crate is excluded
# because of RUSTSEC-2023-0071 (Marvin Attack).
ring = "0.17"

# HTTP/2 stack (h2 crate). Tokio is included ONLY for the io-util
# feature (AsyncRead/AsyncWrite trait definitions). No runtime,
# no reactor, no net, no time. Gossamer's scheduler drives futures
# via `crate::runtime_future::drive`.
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["io-util"] }

# HTTP/3 stack (`std::http_h3`). The QUIC + h3 engine lives in the
# standalone `gossamer-http3` crate so the interpreter (here) and the
# compiled-tier runtime share one implementation; this crate only
# adapts the engine's wire types to `std::http` types.
gossamer-http3 = { workspace = true }

# Crypto primitives (`std::crypto`). RSA is intentionally excluded -
# the `rsa 0.9.x` crate is the only pure-Rust option and carries
# RUSTSEC-2023-0071 (Marvin Attack timing sidechannel, no upstream
# fix). Re-enable once a constant-time replacement lands.
getrandom = "0.3"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
cipher = "0.4"
ctr = "0.9"
chacha20poly1305 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pem"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "pkcs8", "pem", "rand_core"] }
x509-parser = "0.18"
pbkdf2 = { version = "0.12", default-features = false, features = ["std", "hmac"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
blake3 = { version = "1", default-features = false, features = ["std"] }
rand_core = "0.6"

# Legacy / insecure crypto (`std::crypto::insecure`): MD5, SHA1.
md-5 = { version = "0.10", default-features = false, features = ["std"] }
sha1 = { version = "0.10", default-features = false, features = ["std"] }

# Encodings (`std::encoding::{xml,yaml}`). `serde_norway` is the
# maintained fork of the archived `serde_yaml`, API-compatible.
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = "0.9"
quick-xml = "0.40"

# Time-zone surface (`std::time::tz`).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }

# HTTP client surface (`std::http::Client`). HTTPS, redirects, pool.
ureq = { version = "3", features = ["cookies", "json"] }

# Archive readers/writers (`std::archive::{zip,tar}`).
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"

# Arbitrary-precision integers (`std::math::big`).
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

# UUID generation (`std::uuid`). v4 (random) + v7 (timestamp-ordered).
uuid = { version = "1", features = ["v4", "v7"] }

# User-facing TOML (`std::encoding::toml`). Used internally for
# project.toml by gossamer-pkg; now exposed to user code.
toml = "0.9"

# Media type parsing (`std::mime`).
mime = "0.3"
mime_guess = "2"

# POSIX user / group lookup (`std::os::user`).
nix = { version = "0.31", default-features = false, features = ["user", "fs", "process", "signal"] }

# Unicode property tables (`std::unicode`). Real general-category
# tests, normalization forms, and grapheme/word/sentence
# segmentation - replaces the hand-rolled ASCII-only stubs that
# shipped through 0.7.0. Platform-agnostic; pure Rust.
unicode-properties = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
# Self-signed PEM keypair generation for native-client TLS tests.
# Never compiled into the shipped crate.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[target.'cfg(unix)'.dependencies]
# Signal delivery + process-group control for `std::exec`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Console control handler for `std::signal` (Ctrl+C / Ctrl+Break /
# close / logoff / shutdown). Mirrors the unix `signal-hook`
# dispatcher; no equivalent surface ships in std today.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[package]
name = "gossamer-http3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "QUIC + HTTP/3 (RFC 9114) engine shared by the Gossamer interpreter and the compiled-tier runtime."

[lints]
workspace = true

[dependencies]
# QUIC transport + HTTP/3 framing. `runtime-tokio` + `rustls-ring`
# match the feature set the interpreter has shipped; the engine
# owns a private current-thread tokio runtime so it never touches
# the Gossamer scheduler.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
http = "1"
bytes = "1"
thiserror = { workspace = true }

[dev-dependencies]
# Self-signed PEM keypair generation for the QUIC round-trip test.
# Never compiled into the shipped crate. `ring` matches the
# project-wide audited backend (no aws-lc / BoringSSL C build).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[features]
# Opt-in heavy/long-running network test (the QUIC handshake
# round-trip). Off by default so the standard test suite stays
# fast; enable with `cargo test --features slow-network-tests`.
slow-network-tests = []

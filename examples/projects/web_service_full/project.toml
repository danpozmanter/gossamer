# A persistent build of this service would link a SQL driver through a
# Rust crate. Per SPEC.md §12, source-level `extern "C"` items are not
# part of the language; a native binding is wired through the
# `[rust-bindings]` map and the `gossamer-binding` crate, e.g.:
#
#   [rust-bindings]
#   sqlite_driver = { path = "sqlite_driver" }
#
# This example stays self-contained (an in-memory seed, no driver), so
# it declares no binding.

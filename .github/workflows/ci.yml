name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Bypass the rustup override-file consistency check on every proxy
  # invocation. rustup proxies are not concurrent-safe (rustup#988):
  # build scripts in common proc-macro crates call `Command::new("rustc")`,
  # which resolves through PATH to ~/.cargo/bin/rustc (the rustup shim).
  # Many parallel build scripts → many parallel shim calls → each one
  # reads rust-toolchain.toml, runs the override-file consistency check,
  # trips the GHA runner's pre-installed-Rust metadata into a full
  # channel re-sync, and the re-sync ends up downloading `rust-src`.
  # Two concurrent downloads race on the same hash.partial → hash rename
  # and one side dies with "could not rename / No such file" (Linux) or
  # "detected conflict: Cargo.lock" (macOS / Windows).
  #
  # Setting RUSTUP_TOOLCHAIN makes the proxy always dispatch directly
  # to the named toolchain AND suppresses reading rust-toolchain.toml
  # - eliminating the consistency check, the re-sync, the rust-src
  # download, and the race. Documented behavior:
  # https://rust-lang.github.io/rustup/overrides.html
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: rustup set profile minimal
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-clippy-stdio
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  macos-deployment-target:
    name: macOS 15 deployment target
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v2-macos-15-deployment-target
      - name: Verify final Mach-O deployment target
        run: |
          "$CARGO_BIN" test -p gossamer-cli --test cli \
            macos_build_records_15_0_deployment_target -- \
            --exact --nocapture

  test-native:
    name: Test native (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Always use *-latest runners. Pinned major versions
        # (macos-13, ubuntu-20.04, …) get retired by GitHub and
        # the queued job then waits forever for a runner that
        # no longer exists. `ubuntu-24.04-arm` is the exception:
        # GitHub ships Linux arm64 hosted runners only in pinned-major
        # form (no `*-arm-latest` yet), and this is the native aarch64
        # runner that executes direct `gos FILE`, the Cranelift JIT, and `gos
        # build` on real ARM Linux - the Raspberry Pi target.
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
        suite: [general-0, general-1, parity-0-1, parity-2-3, parity-4-5]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v3-test-native-${{ matrix.suite }}
      # `crates/gossamer-cli/build.rs` ensures the runtime
      # staticlib is emitted into `target/<profile>/` for both
      # debug and release; no explicit pre-build step needed.
      # Native build/run crates (`gos build` + direct `gos FILE`) run FIRST, serially,
      # with live output and full diagnostics - ALWAYS, not only on failure.
      # These crates fork llc/linkers and execute freshly-built native
      # binaries, so a miscompile manifests as a test process killed by a
      # signal (SIGSEGV/SIGBUS on Unix; an access violation that drops the
      # whole runner on Windows). A parallel, captured run reports only
      # "N targets failed" - the process dies before libtest names the test -
      # and the previous design parked the live re-run behind `if: failure()`,
      # which never executes when the crash takes the runner down with it.
      # `--test-threads=1 --nocapture` makes the culprit test the last
      # streamed line even in that case, and the dumped IR + preserved
      # artifacts let an unreproducible platform crash be inspected offline.
      # This is slower than a captured parallel run; that cost buys a failure
      # log that always carries the detail, with no unreachable second step.
      - name: Test native build/run crates (one process per test binary)
        shell: bash
        env:
          RUST_BACKTRACE: "full"
          GOS_LLVM_DUMP: "1"
          GOS_LINK_VERBOSE: "1"
          GOS_KEEP_BUILD_ARTIFACTS: "1"
        run: |
          set -uo pipefail
          # Create the artifact dir, THEN redirect the harness scratch dirs
          # (and gos's own build temp) at it. TMPDIR/TEMP/TMP are exported
          # here, not in `env:`, on purpose: a step-level `env:` is applied
          # before the shell starts, so git-bash on Windows would see a
          # not-yet-created temp dir and warn "could not find /tmp, please
          # create!". Exporting after `mkdir` leaves bash's own startup temp
          # valid while still pointing the `cargo test` child (and gos) at the
          # collectable path.
          mkdir -p "${{ github.workspace }}/native-build-artifacts"
          export TMPDIR="${{ github.workspace }}/native-build-artifacts"
          export TEMP="${{ github.workspace }}/native-build-artifacts"
          export TMP="${{ github.workspace }}/native-build-artifacts"
          logdir="$TMPDIR/test-logs"
          mkdir -p "$logdir"
          rc=0
          suite="${{ matrix.suite }}"
          # Run each test binary in its OWN process, serially, streamed live AND
          # teed to a per-binary file. These crates fork llc/linkers and execute
          # freshly built native binaries, so a miscompile manifests as the test
          # process dying by a signal (SIGSEGV/SIGBUS on Unix; a Windows access
          # violation that can drop the whole runner). A single combined
          # `cargo test` runs the binaries concurrently, so their output
          # interleaves and a crash reports only "N targets failed" - the
          # culprit is lost. One invocation per binary keeps every failure
          # attributed to a named target, and the per-binary log survives in the
          # uploaded artifacts even if the crash takes the runner down. Slower
          # than one combined run; that cost buys a failure log that always
          # names the test.
          # The passing output streams inside a collapsed `::group::` so the
          # log stays tidy. On failure the group is NOT enough - GitHub does
          # not auto-expand it, so the previous design forced you to open
          # every section by hand to find the error. Instead, on failure we
          # emit a top-level `::error::` annotation (shown at the top of the
          # run and inline) and re-print the failing test names + panic /
          # assertion lines FLAT, outside the group, so the failure is
          # visible at a glance. The full streamed log stays in the group and
          # in the uploaded artifacts.
          run_target() {
            local crate="$1" label="$2"; shift 2
            local log="$logdir/${crate}-${label}.log"
            local ok=1
            echo "::group::test ${crate} :: ${label}"
            "$CARGO_BIN" test -p "$crate" "$@" --no-fail-fast \
              -- --test-threads=1 --nocapture 2>&1 \
              | tee "$log" || ok=0
            echo "::endgroup::"
            if [ "$ok" -ne 1 ]; then
              rc=1
              echo "::error::test ${crate} :: ${label} FAILED - see flat detail below / uploaded artifacts"
              echo "===================== FAILED: ${crate} :: ${label} ====================="
              grep -nE "panicked at|^test .* \.\.\. FAILED|^error(\[|:)|^failures:|assertion .*failed|left ==|right ==|diverged|Undefined symbols|linker command failed" \
                "$log" | head -n 80 || true
              echo "============ end ${crate} :: ${label} (full log above is collapsed) ============"
            fi
          }
          # The macOS and Windows runners exist to catch failures that appear
          # ONLY off Linux - platform ABI / calling convention, object format,
          # linking, OS syscalls, and the Cranelift JIT / LLVM codegen. A test
          # therefore earns its cross-platform run only if its outcome can
          # differ by OS. The binaries below cannot: they either execute no
          # generated code at all (front-end check / parse / typecheck, the
          # `gos fmt` / `gos doc` / feature-status tooling text, static source
          # and symbol-registry scans, a pure-Rust unit test) or they construct
          # a target object in memory deterministically. Those tests run once
          # in the non-native Ubuntu job below, instead of consuming four
          # serial native lanes. Anything not in the lists below remains
          # cross-platform by default, so new tests cannot silently lose
          # native coverage. `codegen_correct` is a platform-independent
          # language corpus and runs once on Linux; the tier-parity shards
          # retain generated-code coverage on every OS. `rc_soundness` is
          # Linux-only because it self-skips elsewhere.
          non_native_cli="
            client_error_display dispatch_consistency doc_emit_stdlib docs_assets
            ecosystem_bindings feature_status fmt_faithful goroutine_worker_reuse
            http_h2_alpn http_h2_conformance mcp stdlib_compiled_coverage
            stdlib_export_drift
          "
          non_native_cranelift="
            coff_pic_reloc dispatch_parity emit macho_dead_strip
          "
          linux_only="
            codegen_correct rc_soundness
          "
          in_list() {
            local list="$1" name="$2" item
            for item in $list; do [ "$item" = "$name" ] && return 0; done
            return 1
          }
          skip_off_linux() {
            case "${RUNNER_OS:-Linux}" in Linux) return 1 ;; esac
            local name
            for name in $linux_only; do [ "$name" = "$1" ] && return 0; done
            return 1
          }
          if [[ "$suite" = general-* ]]; then
            general_shard="${suite#general-}"
            general_index=0
            target_in_general_shard() {
              local crate="$1" name="$2" assigned
              case "$crate:$name" in
                gossamer-cli:cli)
                  # On Linux, pair the two dominant targets on opposite
                  # shards. Off Linux codegen_correct is covered by the tier
                  # parity lanes, so put cli on the otherwise lighter shard.
                  case "${RUNNER_OS:-Linux}" in
                    Linux) assigned=0 ;;
                    *) assigned=1 ;;
                  esac
                  ;;
                gossamer-codegen-cranelift:codegen_correct)
                  assigned=1
                  ;;
                gossamer-codegen-cranelift:lib)
                  assigned=0
                  ;;
                *)
                  assigned=$((general_index % 2))
                  ;;
              esac
              general_index=$((general_index + 1))
              [ "$assigned" = "$general_shard" ]
            }
            # Pre-build only selected native binaries. The prior package-wide
            # `--no-run` also compiled every non-native integration binary.
            build_target() {
              local crate="$1" label="$2"; shift 2
              local log="$logdir/${crate}-${label}-build.log"
              echo "::group::build ${crate} :: ${label}"
              "$CARGO_BIN" test -p "$crate" --no-run "$@" 2>&1 | tee "$log" || rc=1
              echo "::endgroup::"
            }
            for crate in gossamer-cli gossamer-codegen-cranelift; do
              if [ "$crate" != gossamer-cli ] && target_in_general_shard "$crate" lib; then
                build_target "$crate" lib --lib
                run_target "$crate" lib --lib
              fi
              for f in crates/"$crate"/tests/*.rs; do
                [ -e "$f" ] || continue
                name="$(basename "$f" .rs)"
                # Tier parity has its own parallel shards below.
                [ "$name" = tier_parity ] && continue
                if [ "$crate" = gossamer-cli ] && [ "$name" = repl ]; then
                  echo "::notice::skip ${crate}::${name}; covered by Test non-native CLI and codegen"
                  continue
                fi
                if [ "$crate" = gossamer-cli ] && in_list "$non_native_cli" "$name"; then
                  echo "::notice::skip ${crate}::${name}; covered by Test non-native CLI and codegen"
                  continue
                fi
                if [ "$crate" = gossamer-codegen-cranelift ] && in_list "$non_native_cranelift" "$name"; then
                  echo "::notice::skip ${crate}::${name}; covered by Test non-native CLI and codegen"
                  continue
                fi
                if skip_off_linux "$name"; then
                  echo "::notice::skip ${crate}::${name} on ${RUNNER_OS} (covered on Linux and by cross-platform tier parity)"
                  continue
                fi
                if ! target_in_general_shard "$crate" "$name"; then
                  echo "::notice::skip ${crate}::${name}; assigned to the other general shard"
                  continue
                fi
                build_target "$crate" "$name" --test "$name"
                run_target "$crate" "$name" --test "$name"
              done
            done
          else
            "$CARGO_BIN" test --no-run -p gossamer-cli --test tier_parity \
              2>&1 | tee "$logdir/00-build.log" || rc=1
            groups="${suite#parity-}"
            first="${groups%-*}"
            last="${groups#*-}"
            if [ "$first" = 0 ]; then
              run_target gossamer-cli tier_parity_vm --test tier_parity \
                vm_runs_every_example_without_crashing
            fi
            for group in $(seq "$first" "$last"); do
              run_target gossamer-cli "tier_parity_cranelift_${group}" \
                --test tier_parity "cranelift_parity_group_${group}"
              run_target gossamer-cli "tier_parity_llvm_${group}" \
                --test tier_parity "llvm_parity_group_${group}"
              run_target gossamer-cli "tier_parity_strict_${group}" \
                --test tier_parity "llvm_strict_lower_group_${group}"
            done
          fi
          exit "$rc"
      - name: Upload native build artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-artifacts-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ github.workspace }}/native-build-artifacts
          retention-days: 7
          if-no-files-found: ignore

  test-cli-general:
    name: Test non-native (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: repl-unit
            command: >-
              "$CARGO_BIN" test -p gossamer-cli --lib --test repl -- --nocapture
          - suite: tooling-registry
            command: >-
              "$CARGO_BIN" test -p gossamer-cli
              --test client_error_display --test dispatch_consistency
              --test doc_emit_stdlib --test docs_assets --test feature_status
              --test fmt_faithful --test mcp --test stdlib_compiled_coverage
              --test stdlib_export_drift -- --nocapture
          - suite: bindings-integration
            command: >-
              "$CARGO_BIN" test -p gossamer-cli
              --test ecosystem_bindings -- --nocapture
          - suite: protocol-integration
            command: >-
              "$CARGO_BIN" test -p gossamer-cli
              --test goroutine_worker_reuse
              --test http_h2_alpn --test http_h2_conformance -- --nocapture
          - suite: cranelift-inspection
            command: >-
              "$CARGO_BIN" test -p gossamer-codegen-cranelift
              --test coff_pic_reloc --test dispatch_parity --test emit
              --test macho_dead_strip -- --nocapture
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v1-test-cli-general
      - name: Test non-native behavior
        shell: bash
        env:
          RUST_BACKTRACE: "full"
        run: |
          eval '${{ matrix.command }}'

  test-workspace:
    name: Test workspace (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: frontend
            cargo_args: >-
              -p gossamer-lex -p gossamer-ast -p gossamer-parse
              -p gossamer-resolve -p gossamer-hir -p gossamer-types
              -p gossamer-diagnostics
          - suite: ir-codegen
            cargo_args: >-
              -p gossamer-mir -p gossamer-codegen-llvm -p gossamer-abi
              -p gossamer-binding -p gossamer-binding-macros
          - suite: runtime-interpreter
            cargo_args: >-
              -p gossamer-runtime -p gossamer-interp -p gossamer-sched
              -p gossamer-coro
          - suite: stdlib-tooling
            cargo_args: >-
              --workspace
              --exclude gossamer-cli --exclude gossamer-codegen-cranelift
              --exclude gossamer-lex --exclude gossamer-ast
              --exclude gossamer-parse --exclude gossamer-resolve
              --exclude gossamer-hir --exclude gossamer-types
              --exclude gossamer-diagnostics --exclude gossamer-mir
              --exclude gossamer-codegen-llvm --exclude gossamer-abi
              --exclude gossamer-binding --exclude gossamer-binding-macros
              --exclude gossamer-runtime --exclude gossamer-interp
              --exclude gossamer-sched --exclude gossamer-coro
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v3-test-workspace-${{ matrix.suite }}
      - name: Test ${{ matrix.suite }}
        shell: bash
        env:
          RUST_BACKTRACE: "full"
        run: |
          "$CARGO_BIN" test --no-fail-fast ${{ matrix.cargo_args }} \
            --lib --tests -- --nocapture

  release-build:
    name: Build release workspace
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v3-release-workspace
      - name: Build release
        shell: bash
        run: |
          "$CARGO_BIN" build --release --workspace

  test-platform-libraries:
    name: Test platform libraries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v2-test-platform-libraries
      - name: Test OS-sensitive libraries
        shell: bash
        env:
          RUST_BACKTRACE: "full"
        run: |
          "$CARGO_BIN" test --no-fail-fast --lib --tests \
            -p gossamer-runtime -p gossamer-interp -p gossamer-sched \
            -p gossamer-coro -p gossamer-std -p gossamer-pkg \
            -p gossamer-http3 -p gossamer-ws -- --nocapture

  musl-build:
    name: Musl build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-musl-stdio
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo check --workspace --features musl --target x86_64-unknown-linux-musl

  cross-targets:
    name: cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cross-${{ matrix.target }}
      # Some transitive C-bound deps (blake3, ring) invoke cc-rs from
      # their build scripts and need a target-prefixed cross compiler.
      # wasm32-* don't need a C toolchain.
      - name: install cross C toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            riscv64gc-unknown-linux-gnu)
              sudo apt-get install -y gcc-riscv64-linux-gnu
              echo "CC_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "AR_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
          esac
      # The contract this job enforces is per-target. The full Linux
      # cross targets (aarch64-gnu, riscv64-gnu) check the runtime
      # surface end-to-end. The wasm32 targets check only the truly
      # platform-agnostic crates - rustls / corosensei / mio aren't
      # wasm-portable, so runtime / sched / binding / pkg can't be
      # asked to compile there.
      - name: cargo check (target-appropriate crate set)
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu|riscv64gc-unknown-linux-gnu)
              crates="gossamer-runtime gossamer-abi gossamer-binding gossamer-binding-macros gossamer-pkg gossamer-sched"
              ;;
            wasm32-unknown-unknown|wasm32-wasip1)
              crates="gossamer-abi gossamer-binding-macros"
              ;;
            *)
              echo "unknown target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          for crate in $crates; do
            cargo check -p "$crate" --target ${{ matrix.target }} || exit 1
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # The Docker action carries its own Rust toolchain. Do not pass the
    # workspace-wide host override into that container.
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: mkdocs build (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict

  cargo-doc:
    name: cargo doc + doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo-doc
      - name: cargo doc --workspace (deny broken intra-doc links)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
      - name: cargo test --doc --workspace
        env:
          RUST_BACKTRACE: "full"
        run: cargo test --doc --workspace --no-fail-fast -- --nocapture

  stdlib-docs-drift:
    name: gos doc --emit-stdlib --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-stdlib-docs-drift
      - name: Build gos
        run: cargo build --bin gos
      - name: Verify docs_src/stdlib/ matches manifest::ALL_MODULES
        run: ./target/debug/gos doc --emit-stdlib docs_src/stdlib --check
      - name: Verify generated LLM documentation is byte-clean
        run: cargo xtask docs-llm --check

  # Cross-compilation correctness: `gos build --target aarch64-linux-*`
  # from a Linux host, run under QEMU, must match the bytecode VM. This is
  # the all-tier gate for the Linux-host cross path (gnu + musl).
  cross-from-linux:
    name: Cross Linux -> aarch64-linux + QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v2-cross-from-linux
      - name: Install zig
        # A direct download instead of `mlugg/setup-zig`: that action
        # still declares a Node 20 runtime (triggering the deprecation
        # warning on every run), and independently, its `v1` line never
        # picked up upstream's tarball-naming fix for Zig >=0.14.1
        # (`zig-<arch>-<os>-<version>`, not the pre-0.14.1
        # `zig-<os>-<arch>-<version>`), so every mirror plus the
        # "official" fallback 404s for any current Zig release. The
        # official index (ziglang.org/download/index.json) confirms the
        # real filename below.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) zig_arch=x86_64 ;;
            aarch64|arm64) zig_arch=aarch64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          zig_ver=0.16.0
          zig_tarball="zig-${zig_arch}-linux-${zig_ver}.tar.xz"
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${zig_ver}/${zig_tarball}"
          mkdir -p /tmp/zig-install
          tar -xf /tmp/zig.tar.xz -C /tmp/zig-install --strip-components=1
          echo "/tmp/zig-install" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install cross toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user llvm clang
          rustup target add aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          # qemu-aarch64 needs the target's REAL runtime shared libraries to
          # execute the gnu leg's dynamically-linked binary - the
          # `libc6-dev-arm64-cross` gcc-aarch64-linux-gnu pulls in ships
          # only headers, static archives, and dev symlinks for *linking*,
          # never the actual libc.so.6 / ld-linux-aarch64.so.1 bytes a
          # running binary needs (confirmed: `dpkg -c` on that package
          # contains no *.so.<N> file, only *.so -> *.so.<N> dev symlinks
          # to files it doesn't ship). Enable the arm64 architecture via
          # Ubuntu's multiarch ports archive and install the real runtime
          # libs; they land at the same absolute multiarch paths
          # (/lib/aarch64-linux-gnu, /usr/lib/aarch64-linux-gnu) the
          # aarch64 dynamic linker already searches, so qemu-aarch64 finds
          # them with no `-L`/sysroot argument needed. libgcc-s1 covers the
          # shared unwinder (panic=unwind is load-bearing here).
          sudo dpkg --add-architecture arm64
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          # `libc6` / `libgcc-s1` are `Multi-Arch: same`, which requires the
          # arm64 build to be the *exact same version* as the amd64 one
          # already installed. The base `noble` pocket on ports.ubuntu.com
          # is the GA release; the amd64 packages already on the runner
          # come from `noble-updates`/`noble-security` point releases, a
          # newer version - mirror all three pockets so apt can actually
          # find a matching arm64 version instead of refusing the install
          # with an unsatisfiable-dependency wall (which cascades into
          # "remove half the base system").
          {
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename} main universe"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename}-updates main universe"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename}-security main universe"
          } | sudo tee /etc/apt/sources.list.d/arm64.list
          # Scope this update to ONLY the new source file. Registering
          # arm64 with dpkg makes apt query EVERY already-configured
          # source for it too, and the runner's default sources
          # (archive.ubuntu.com's mirror, security.ubuntu.com) don't
          # carry arm64 packages at all - a plain `apt-get update` here
          # 404s on all of them. `sourceparts=-` disables the
          # sources.list.d directory scan and `sourcelist` names only the
          # new file, so nothing else is touched. Verified with
          # `apt-get update --print-uris` against this exact config: only
          # ports.ubuntu.com URIs are produced.
          sudo apt-get update \
            -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/arm64.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y libc6:arm64 libgcc-s1:arm64
      - name: Build the target runtime archives
        # The gnu leg's native C deps (ring, mimalloc, zstd) cross-compile
        # with the apt-installed `aarch64-linux-gnu-gcc` (cc-rs's default
        # tool-name guess for this target already matches that package's
        # binary). The musl leg has no matching distro package, and a bare
        # `CC=zig cc` doesn't work either: cc-rs always appends its own
        # `--target=<rustc-llvm-triple>` for a clang-family compiler (needed
        # to select clang's cross toolchain), and that 4-component
        # `*-unknown-linux-musl` form is one zig's own target parser
        # rejects outright, so it wins over (and breaks) whatever `-target`
        # we pass through `CC`. `cargo zigbuild` is the maintained tool that
        # already reconciles this: it drives zig as the C/archive toolchain
        # with the target-triple translation cc-rs's own flag needs.
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu -p gossamer-runtime
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p gossamer-runtime
      - name: Build gos
        run: cargo build --bin gos
      - name: Cross build + QEMU diff against the VM
        run: cargo test -p gossamer-cli --test cross_compile -- --nocapture

  # A macOS host must produce a correct aarch64-linux binary. macOS runners
  # cannot execute a Linux ELF, so this job builds + uploads; the QEMU diff
  # runs on Linux below. The musl-static target is the host-agnostic path
  # (rustup ships the CRT; ld.lld emits ELF on any host).
  # A macOS host must produce correct aarch64-linux and x86_64-linux
  # binaries (musl is the host-agnostic path). macOS runners cannot
  # execute a Linux ELF, so this job builds + uploads; the QEMU/native
  # diff runs on Linux below. mimalloc's C is cross-compiled via `cargo
  # zigbuild` (zig as the C toolchain).
  cross-from-macos:
    name: Cross macOS -> {aarch64,x86_64}-linux-musl
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v2-cross-from-macos
      - name: Install zig
        # See the cross-from-linux job for why this replaces
        # `mlugg/setup-zig`: it still runs on a deprecated Node 20
        # runtime, and its `v1` line 404s fetching any current Zig
        # release (a stale pre-0.14.1 tarball-naming assumption).
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) zig_arch=x86_64 ;;
            arm64|aarch64) zig_arch=aarch64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          zig_ver=0.16.0
          zig_tarball="zig-${zig_arch}-macos-${zig_ver}.tar.xz"
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${zig_ver}/${zig_tarball}"
          mkdir -p /tmp/zig-install
          tar -xf /tmp/zig.tar.xz -C /tmp/zig-install --strip-components=1
          echo "/tmp/zig-install" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install ld.lld + musl targets
        run: |
          # The macOS runner image pre-taps `aws/tap`, which Homebrew's tap
          # trust check now refuses by default; untap it since this job has
          # no use for it, rather than disabling the trust check globally.
          brew untap aws/tap || true
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - name: Build target runtime archives + gos
        # Bare `clang --target=...` has no musl sysroot on macOS, so it
        # can't find the target's libc headers (`string.h`, ...). `cargo
        # zigbuild` drives the native C deps (ring, mimalloc, zstd) through
        # zig instead, which bundles a musl sysroot for every target it
        # supports (see the cross-from-linux job for why a hand-rolled
        # `CC=zig cc` doesn't work and `cargo zigbuild` is used instead).
        run: |
          for t in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            cargo zigbuild --release --target "$t" -p gossamer-runtime
          done
          cargo build --bin gos
      - name: Cross build the fixtures (both targets)
        env:
          GOS_RUNTIME_LIB_AARCH64_UNKNOWN_LINUX_MUSL: target/aarch64-unknown-linux-musl/release/libgossamer_runtime.a
          GOS_RUNTIME_LIB_X86_64_UNKNOWN_LINUX_MUSL: target/x86_64-unknown-linux-musl/release/libgossamer_runtime.a
        run: |
          ./scripts/cross_build_fixtures.sh aarch64-unknown-linux-musl out-macos
          ./scripts/cross_build_fixtures.sh x86_64-unknown-linux-musl out-macos
      - uses: actions/upload-artifact@v7
        with:
          name: cross-bins-macos
          path: out-macos

  # A Windows host must produce correct aarch64-linux and x86_64-linux
  # binaries. rust-lld (shipped with the toolchain) is the ELF linker;
  # `gos` selects it for the Windows-host -> Linux-target cross.
  cross-from-windows:
    name: Cross Windows -> {aarch64,x86_64}-linux-musl
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v2-cross-from-windows
      - name: Install zig
        # See the cross-from-linux job for why this replaces
        # `mlugg/setup-zig`: it still runs on a deprecated Node 20
        # runtime, and its `v1` line 404s fetching any current Zig
        # release (a stale pre-0.14.1 tarball-naming assumption).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zigArch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $zigVer = '0.16.0'
          $tarball = "zig-$zigArch-windows-$zigVer.zip"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVer/$tarball" -OutFile "$env:RUNNER_TEMP\zig.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'zig-install'
          Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath $dest
          $inner = Get-ChildItem $dest | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $inner.FullName
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install musl targets
        run: rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - name: Build target runtime archives + gos
        shell: bash
        # See the macOS job above for why `cargo zigbuild` replaces plain
        # `cargo build` here: the native C deps need a musl sysroot the
        # system compiler doesn't ship, and zig bundles one.
        run: |
          for t in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            cargo zigbuild --release --target "$t" -p gossamer-runtime
          done
          cargo build --bin gos
      - name: Cross build the fixtures (both targets)
        env:
          GOS_RUNTIME_LIB_AARCH64_UNKNOWN_LINUX_MUSL: target/aarch64-unknown-linux-musl/release/libgossamer_runtime.a
          GOS_RUNTIME_LIB_X86_64_UNKNOWN_LINUX_MUSL: target/x86_64-unknown-linux-musl/release/libgossamer_runtime.a
        run: |
          pwsh -File scripts/cross_build_fixtures.ps1 aarch64-unknown-linux-musl out-windows
          pwsh -File scripts/cross_build_fixtures.ps1 x86_64-unknown-linux-musl out-windows
      - uses: actions/upload-artifact@v7
        with:
          name: cross-bins-windows
          path: out-windows

  # Run the macOS/Windows host cross artifacts under QEMU and diff against
  # the VM. Closes the loop on the multi-host matrix: the producing host
  # cannot run the foreign ELF, so a Linux job validates the output. Needed
  # for both legs of each producing job - the x86_64 binaries run natively
  # on this (x86_64) runner, and the aarch64 binaries run under qemu-user -
  # this is the only job that ever executes what cross-from-macos and
  # cross-from-windows produce.
  cross-run-under-qemu:
    name: Run macOS/Windows cross-built bins under QEMU
    needs: [cross-from-macos, cross-from-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-test-setup
        with:
          cache-prefix: v2-cross-run-qemu
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - uses: actions/download-artifact@v8
        with:
          pattern: cross-bins-*
          path: bins
      - name: Build gos
        run: cargo build --bin gos
      - name: Each cross binary must match the VM
        run: ./scripts/qemu_diff_against_vm.sh bins

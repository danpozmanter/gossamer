name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-clippy-stdio
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      # `gos build` shells out to `opt` and `llc` from LLVM 18+.
      # Ubuntu runners ship them at `/usr/lib/llvm-18/bin/` (auto-
      # discovered); macOS and Windows runners need explicit
      # discovery + env-var pointers. Both steps run BEFORE
      # `dtolnay/rust-toolchain@stable` so its `$GITHUB_PATH`
      # push of `~/.cargo/bin` is the last entry on PATH —
      # without that ordering, a brew-managed `cargo` shim
      # (left by a stale `rustup-init` install on the macOS
      # runner image) gets resolved ahead of the rust toolchain
      # this job actually installed, and `cargo test` becomes
      # `rustup-init test` → unrecognised-argument failure.
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          test -x "$prefix/bin/opt" || { echo "opt missing under $prefix/bin" >&2; exit 1; }
          test -x "$prefix/bin/llc" || { echo "llc missing under $prefix/bin" >&2; exit 1; }
          echo "GOS_LLVM_OPT=$prefix/bin/opt" >> "$GITHUB_ENV"
          echo "GOS_LLC=$prefix/bin/llc"      >> "$GITHUB_ENV"
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The upstream LLVM Windows installer (wrapped by the
          # chocolatey `llvm` package) ships a slim distribution:
          # clang / clang-cl / clang-tidy / lld / llvm-ar — but
          # NOT `opt.exe` or `llc.exe`, the two binaries our
          # codegen pipeline drives. Pull the full toolchain from
          # MSYS2's `mingw-w64-x86_64-llvm` package, which is
          # preinstalled on the windows-latest runner image at
          # `C:\msys64\` and includes both.
          function Find-LlvmTool($name) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($dir in @(
              'C:\msys64\mingw64\bin',
              'C:\msys64\clang64\bin',
              'C:\Program Files\LLVM\bin',
              'C:\Program Files (x86)\LLVM\bin'
            )) {
              $cand = Join-Path $dir $name
              if (Test-Path $cand) { return $cand }
            }
            return $null
          }
          $opt = Find-LlvmTool 'opt.exe'
          $llc = Find-LlvmTool 'llc.exe'
          if (-not $opt -or -not $llc) {
            Write-Host "Installing mingw-w64 LLVM via MSYS2 pacman"
            & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed `
              mingw-w64-x86_64-llvm
            if ($LASTEXITCODE -ne 0) {
              throw "pacman -S mingw-w64-x86_64-llvm failed (exit $LASTEXITCODE)"
            }
            $opt = Find-LlvmTool 'opt.exe'
            $llc = Find-LlvmTool 'llc.exe'
          }
          if (-not $opt -or -not $llc) {
            Write-Host "=== Diagnostic: contents of expected install dirs ==="
            foreach ($d in @(
              'C:\msys64\mingw64\bin',
              'C:\Program Files\LLVM\bin'
            )) {
              if (Test-Path $d) {
                Write-Host "--- $d ---"
                Get-ChildItem -Path $d -Filter '*.exe' -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty Name | Sort-Object | Format-Wide -Column 4 |
                  Out-String | Write-Host
              } else {
                Write-Host "--- $d  (missing) ---"
              }
            }
            if (-not $opt) { throw "opt.exe not found after MSYS2 install" }
            if (-not $llc) { throw "llc.exe not found after MSYS2 install" }
          }
          Write-Host "GOS_LLVM_OPT=$opt"
          Write-Host "GOS_LLC=$llc"
          "GOS_LLVM_OPT=$opt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GOS_LLC=$llc"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped after the runtime stdio rewrite (extern POSIX
          # `write` removed). Old cached `target/<profile>/deps/`
          # rlibs still reference the absent symbol on Windows
          # MSVC; bumping the prefix forces a clean rebuild.
          prefix-key: v2-test-stdio
      # `crates/gossamer-cli/build.rs` ensures the runtime
      # staticlib is emitted into `target/<profile>/` for both
      # debug and release; no explicit pre-build step needed.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --release --workspace

  idle-cpu:
    name: Idle CPU regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-idle-stdio
      - run: cargo build --release -p gossamer-cli
      - run: ./benchmarks/idle/check.sh

  musl-build:
    name: Musl build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-musl-stdio
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo check --workspace --features musl --target x86_64-unknown-linux-musl

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-audit-stdio
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  docs:
    name: mkdocs build (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict

  stdlib-docs-drift:
    name: gos doc --emit-stdlib --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-stdlib-docs-drift
      - name: Build gos
        run: cargo build --bin gos
      - name: Verify docs_src/stdlib/ matches manifest::ALL_MODULES
        run: ./target/debug/gos doc --emit-stdlib docs_src/stdlib --check

  spec-banners:
    name: SPEC.md conformance banners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-spec-banners
      - name: Validate every required banner is present + vocabulary
        run: cargo run -p xtask --quiet -- audit-spec-banners

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-clippy-stdio
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped after the runtime stdio rewrite (extern POSIX
          # `write` removed). Old cached `target/<profile>/deps/`
          # rlibs still reference the absent symbol on Windows
          # MSVC; bumping the prefix forces a clean rebuild.
          prefix-key: v2-test-stdio
      # `gos build` shells out to `opt` and `llc` from LLVM 18+.
      # Ubuntu runners ship them at `/usr/lib/llvm-18/bin/` (picked
      # up by the auto-discovery candidates); macOS and Windows
      # runners need an explicit install + env-var pointer.
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          echo "GOS_LLVM_OPT=$prefix/bin/opt" >> "$GITHUB_ENV"
          echo "GOS_LLC=$prefix/bin/llc"      >> "$GITHUB_ENV"
      - name: Locate LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$bin\opt.exe")) {
            choco install -y --no-progress llvm
          }
          if (-not (Test-Path "$bin\opt.exe")) {
            throw "opt.exe still missing under $bin after install"
          }
          "GOS_LLVM_OPT=$bin\opt.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GOS_LLC=$bin\llc.exe"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # `crates/gossamer-cli/build.rs` ensures the runtime
      # staticlib is emitted into `target/<profile>/` for both
      # debug and release; no explicit pre-build step needed.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --release --workspace

  idle-cpu:
    name: Idle CPU regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-idle-stdio
      - run: cargo build --release -p gossamer-cli
      - run: ./benchmarks/idle/check.sh

  musl-build:
    name: Musl build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-musl-stdio
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo check --workspace --features musl --target x86_64-unknown-linux-musl

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-audit-stdio
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  docs:
    name: mkdocs build (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict

  stdlib-docs-drift:
    name: gos doc --emit-stdlib --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-stdlib-docs-drift
      - name: Build gos
        run: cargo build --bin gos
      - name: Verify docs_src/stdlib/ matches manifest::ALL_MODULES
        run: ./target/debug/gos doc --emit-stdlib docs_src/stdlib --check

  spec-banners:
    name: SPEC.md conformance banners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-spec-banners
      - name: Validate every required banner is present + vocabulary
        run: cargo run -p xtask --quiet -- audit-spec-banners

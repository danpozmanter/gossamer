name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Bypass the rustup override-file consistency check on every proxy
  # invocation. rustup proxies are not concurrent-safe (rustup#988):
  # build scripts in common proc-macro crates call `Command::new("rustc")`,
  # which resolves through PATH to ~/.cargo/bin/rustc (the rustup shim).
  # Many parallel build scripts → many parallel shim calls → each one
  # reads rust-toolchain.toml, runs the override-file consistency check,
  # trips the GHA runner's pre-installed-Rust metadata into a full
  # channel re-sync, and the re-sync ends up downloading `rust-src`.
  # Two concurrent downloads race on the same hash.partial → hash rename
  # and one side dies with "could not rename / No such file" (Linux) or
  # "detected conflict: Cargo.lock" (macOS / Windows).
  #
  # Setting RUSTUP_TOOLCHAIN makes the proxy always dispatch directly
  # to the named toolchain AND suppresses reading rust-toolchain.toml
  # — eliminating the consistency check, the re-sync, the rust-src
  # download, and the race. Documented behavior:
  # https://rust-lang.github.io/rustup/overrides.html
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: rustup set profile minimal
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-clippy-stdio
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Always use *-latest runners. Pinned major versions
        # (macos-13, ubuntu-20.04, …) get retired by GitHub and
        # the queued job then waits forever for a runner that
        # no longer exists.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      # `gos build` shells out to `opt` and `llc` from LLVM 18+.
      # Ubuntu runners ship them at `/usr/lib/llvm-18/bin/` (auto-
      # discovered); macOS and Windows runners need explicit
      # discovery + env-var pointers. Both steps run BEFORE
      # `dtolnay/rust-toolchain@1.95.0` so its `$GITHUB_PATH`
      # push of `~/.cargo/bin` is the last entry on PATH —
      # without that ordering, a brew-managed `cargo` shim
      # (left by a stale `rustup-init` install on the macOS
      # runner image) gets resolved ahead of the rust toolchain
      # this job actually installed, and `cargo test` becomes
      # `rustup-init test` → unrecognised-argument failure.
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          test -x "$prefix/bin/opt" || { echo "opt missing under $prefix/bin" >&2; exit 1; }
          test -x "$prefix/bin/llc" || { echo "llc missing under $prefix/bin" >&2; exit 1; }
          echo "GOS_LLVM_OPT=$prefix/bin/opt" >> "$GITHUB_ENV"
          echo "GOS_LLC=$prefix/bin/llc"      >> "$GITHUB_ENV"
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The upstream LLVM Windows installer (wrapped by the
          # chocolatey `llvm` package) ships a slim distribution:
          # clang / clang-cl / clang-tidy / lld / llvm-ar — but
          # NOT `opt.exe` or `llc.exe`, the two binaries our
          # codegen pipeline drives. Pull the full toolchain from
          # MSYS2's `mingw-w64-x86_64-llvm` package, which is
          # preinstalled on the windows-latest runner image at
          # `C:\msys64\` and includes both.
          function Find-LlvmTool($name) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($dir in @(
              'C:\msys64\mingw64\bin',
              'C:\msys64\clang64\bin',
              'C:\Program Files\LLVM\bin',
              'C:\Program Files (x86)\LLVM\bin'
            )) {
              $cand = Join-Path $dir $name
              if (Test-Path $cand) { return $cand }
            }
            return $null
          }
          $opt = Find-LlvmTool 'opt.exe'
          $llc = Find-LlvmTool 'llc.exe'
          if (-not $opt -or -not $llc) {
            Write-Host "Installing mingw-w64 LLVM via MSYS2 pacman"
            & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed `
              mingw-w64-x86_64-llvm
            if ($LASTEXITCODE -ne 0) {
              throw "pacman -S mingw-w64-x86_64-llvm failed (exit $LASTEXITCODE)"
            }
            $opt = Find-LlvmTool 'opt.exe'
            $llc = Find-LlvmTool 'llc.exe'
          }
          if (-not $opt -or -not $llc) {
            Write-Host "=== Diagnostic: contents of expected install dirs ==="
            foreach ($d in @(
              'C:\msys64\mingw64\bin',
              'C:\Program Files\LLVM\bin'
            )) {
              if (Test-Path $d) {
                Write-Host "--- $d ---"
                Get-ChildItem -Path $d -Filter '*.exe' -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty Name | Sort-Object | Format-Wide -Column 4 |
                  Out-String | Write-Host
              } else {
                Write-Host "--- $d  (missing) ---"
              }
            }
            if (-not $opt) { throw "opt.exe not found after MSYS2 install" }
            if (-not $llc) { throw "llc.exe not found after MSYS2 install" }
          }
          Write-Host "GOS_LLVM_OPT=$opt"
          Write-Host "GOS_LLC=$llc"
          "GOS_LLVM_OPT=$opt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GOS_LLC=$llc"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped after the runtime stdio rewrite (extern POSIX
          # `write` removed). Old cached `target/<profile>/deps/`
          # rlibs still reference the absent symbol on Windows
          # MSVC; bumping the prefix forces a clean rebuild.
          prefix-key: v2-test-stdio
      # Defensive against the macOS-runner brew/rustup shim issue:
      # `cargo` in $PATH can resolve to `rustup-init` even after
      # `dtolnay/rust-toolchain@1.95.0` pushes `~/.cargo/bin` to
      # $GITHUB_PATH (the runner image ships a brew-managed `cargo`
      # link earlier in PATH on some images). Resolve the real
      # toolchain binary via `rustup which cargo` and export it as
      # $CARGO_BIN; subsequent steps invoke that absolute path so a
      # stray shim cannot intercept `cargo test` and produce
      # `error: unexpected argument 'test' found / rustup-init`.
      - name: Resolve cargo binary (shim guard)
        shell: bash
        run: |
          set -euxo pipefail
          # The macOS runner image ships a brew-installed `cargo`/`rustup`
          # link that can be the standalone `rustup-init` installer
          # binary; resolving via $PATH then dispatches `cargo test`
          # to `rustup-init test` and errors with
          # `unexpected argument 'test'`. Resolving through
          # `~/.cargo/bin/rustup which cargo` bypasses any PATH-resolved
          # shim and yields the absolute path to the toolchain cargo
          # that `dtolnay/rust-toolchain@1.95.0` actually installed.
          which cargo || true
          which rustup || true
          rustup_bin="$HOME/.cargo/bin/rustup"
          if [ ! -x "$rustup_bin" ]; then
            echo "::error::$rustup_bin missing — rust-toolchain action did not install rustup at the expected path"
            ls -la "$HOME/.cargo/bin/" || true
            exit 1
          fi
          "$rustup_bin" --version
          resolved_cargo="$("$rustup_bin" which cargo)"
          echo "resolved cargo => $resolved_cargo"
          "$resolved_cargo" --version
          echo "CARGO_BIN=$resolved_cargo" >> "$GITHUB_ENV"
      # `crates/gossamer-cli/build.rs` ensures the runtime
      # staticlib is emitted into `target/<profile>/` for both
      # debug and release; no explicit pre-build step needed.
      - name: Test
        shell: bash
        run: |
          "$CARGO_BIN" test --workspace --no-fail-fast
      - name: Build release
        shell: bash
        run: |
          "$CARGO_BIN" build --release --workspace

  idle-cpu:
    name: Idle CPU regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-idle-stdio
      - run: cargo build --release -p gossamer-cli
      - run: ./benchmarks/idle/check.sh

  musl-build:
    name: Musl build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-musl-stdio
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo check --workspace --features musl --target x86_64-unknown-linux-musl

  cross-targets:
    name: cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cross-${{ matrix.target }}
      # gossamer-cli (and friends) intentionally aren't expected to
      # compile against wasm/no-std targets — they pull in tokio /
      # libc / mio. The contract this job enforces: the runtime,
      # the binding macros, and the package surface compile clean.
      - name: cargo check (runtime / ABI / binding / pkg / gc / sched)
        run: |
          for crate in gossamer-runtime gossamer-abi gossamer-binding gossamer-binding-macros gossamer-pkg gossamer-gc gossamer-sched; do
            cargo check -p "$crate" --target ${{ matrix.target }} || exit 1
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-audit-stdio
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  docs:
    name: mkdocs build (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict

  cargo-doc:
    name: cargo doc + doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo-doc
      - name: cargo doc --workspace (deny broken intra-doc links)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
      - name: cargo test --doc --workspace
        run: cargo test --doc --workspace --release

  stdlib-docs-drift:
    name: gos doc --emit-stdlib --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-stdlib-docs-drift
      - name: Build gos
        run: cargo build --bin gos
      - name: Verify docs_src/stdlib/ matches manifest::ALL_MODULES
        run: ./target/debug/gos doc --emit-stdlib docs_src/stdlib --check

  spec-banners:
    name: SPEC.md conformance banners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-spec-banners
      - name: Validate every required banner is present + vocabulary
        run: cargo run -p xtask --quiet -- audit-spec-banners

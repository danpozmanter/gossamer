name: Perf gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # See ci.yml for the full explanation. rustup proxies are not
      # concurrent-safe (rustup#988); RUSTUP_TOOLCHAIN suppresses the
      # rust-toolchain.toml override-file read in every proxy
      # invocation, eliminating the rust-src download race.
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - run: rustup set profile minimal
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 lld-18
          echo "GOS_LLC=/usr/bin/llc-18" >> "$GITHUB_ENV"
          echo "GOS_LLVM_OPT=/usr/bin/opt-18" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore perf baseline
        id: restore-baseline
        uses: actions/cache@v4
        with:
          path: .perf/baseline.txt
          # Baseline is keyed to the main branch head. PRs restore the
          # most recent main baseline and compare against it; pushes to
          # main write a new baseline entry after the run.
          key: perf-baseline-${{ runner.os }}-${{ github.base_ref == '' && github.sha || 'main' }}
          restore-keys: |
            perf-baseline-${{ runner.os }}-

      - name: Build release `gos`
        run: cargo build --release -p gossamer-cli

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          GOS=./target/release/gos
          mkdir -p .perf

          # time_ns LABEL ARGS... - benchmarks the command and appends
          # "LABEL <minimum-nanoseconds>" to .perf/current.txt.
          #
          # One discarded warmup run pages in the binary and primes the OS
          # cache; the fastest of PERF_RUNS timed runs is then recorded. The
          # minimum is the run least perturbed by scheduler preemption, CPU
          # frequency scaling, and cache misses, so it isolates the program's
          # cost from one-off machine noise. A genuine regression slows every
          # run including the fastest, so the minimum still trips the gate;
          # only transient blips are filtered out. These programs finish in a
          # few milliseconds, dominated by process startup - a single cold
          # sample of one is mostly noise. The baseline keeps the per-benchmark
          # minimum across main pushes (see "Update baseline on main"), so
          # recording the minimum here compares like with like.
          PERF_RUNS="${PERF_RUNS:-7}"
          time_ns() {
            local label=$1; shift
            "$@" >/dev/null 2>&1
            local i start end ns best=
            for ((i = 0; i < PERF_RUNS; i++)); do
              start=$(date +%s%N)
              "$@" >/dev/null 2>&1
              end=$(date +%s%N)
              ns=$((end - start))
              if [[ -z "$best" || "$ns" -lt "$best" ]]; then
                best=$ns
              fi
            done
            echo "$label $best" | tee -a .perf/current.txt
          }

          rm -f .perf/current.txt

          # Arithmetic-heavy: factorial via recursion
          [[ -f examples/factorial.gos ]] && time_ns factorial "$GOS" run examples/factorial.gos

          # String + I/O: hello world (baseline for interpreter startup)
          [[ -f examples/hello_world.gos ]] && time_ns hello_world "$GOS" run examples/hello_world.gos

          # Struct + field arithmetic: generic struct instantiation
          [[ -f examples/generic_struct.gos ]] && time_ns generic_struct "$GOS" run examples/generic_struct.gos

      - name: Compare against baseline
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=.perf/current.txt
          BASELINE=.perf/baseline.txt

          if [[ ! -f "$CURRENT" ]]; then
            echo "No benchmark results - skipping comparison."
            exit 0
          fi

          # Hard wall-clock cap: 30 s per benchmark.
          awk '{
            if ($2 > 30000000000) {
              print "PERF ABORT: " $1 " took " int($2/1000000) "ms (> 30 s limit)"
              exit 1
            }
          }' "$CURRENT"

          if [[ ! -f "$BASELINE" ]]; then
            echo "No baseline yet - this run establishes one."
            cp "$CURRENT" "$BASELINE"
            exit 0
          fi

          # 2× regression check: fail if any benchmark exceeds twice
          # its baseline. Missing baseline entries are skipped.
          python3 - "$BASELINE" "$CURRENT" <<'PY'
          import sys, collections

          def load(path):
              d = {}
              for line in open(path):
                  parts = line.split()
                  if len(parts) == 2:
                      d[parts[0]] = int(parts[1])
              return d

          base = load(sys.argv[1])
          curr = load(sys.argv[2])
          regressions = []
          for name, ns in curr.items():
              if name not in base:
                  continue
              ratio = ns / base[name]
              ms_curr = ns // 1_000_000
              ms_base = base[name] // 1_000_000
              status = "OK" if ratio < 2.0 else "REGRESSION"
              print(f"  {name}: {ms_curr}ms (baseline {ms_base}ms, {ratio:.2f}x) [{status}]")
              if ratio >= 2.0:
                  regressions.append(name)
          if regressions:
              print(f"\nPerf regressions (>2x baseline): {', '.join(regressions)}")
              sys.exit(1)
          PY

      - name: Update baseline on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          # Merge current results into the baseline: keep the minimum
          # (fastest observed) per benchmark so a one-off slow run on
          # main doesn't permanently raise the bar.
          CURRENT=.perf/current.txt
          BASELINE=.perf/baseline.txt
          python3 - "$BASELINE" "$CURRENT" <<'PY'
          import sys

          def load(path):
              d = {}
              try:
                  for line in open(path):
                      parts = line.split()
                      if len(parts) == 2:
                          d[parts[0]] = int(parts[1])
              except FileNotFoundError:
                  pass
              return d

          base = load(sys.argv[1])
          curr = load(sys.argv[2])
          merged = {**base, **curr}
          # Take the minimum (fastest) for any benchmark in both.
          for k in set(base) & set(curr):
              merged[k] = min(base[k], curr[k])
          with open(sys.argv[1], 'w') as f:
              for k, v in sorted(merged.items()):
                  f.write(f"{k} {v}\n")
          PY

      - name: Save updated baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: .perf/baseline.txt
          key: perf-baseline-${{ runner.os }}-${{ github.sha }}

      - name: Upload perf log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-log
          path: .perf/

  # Cross-platform native-binary perf gate. The `perf` job above only times
  # `gos run` on Linux; this one builds a `gos build --release` native binary
  # on all three Tier-1 platforms and times it, so an allocator/codegen
  # regression (or a tier silently degrading to the interpreter) is visible on
  # macOS and Windows too - not just Linux.
  perf-native:
    name: Perf native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 lld-18
          echo "GOS_LLC=/usr/bin/llc-18" >> "$GITHUB_ENV"
          echo "GOS_LLVM_OPT=/usr/bin/opt-18" >> "$GITHUB_ENV"
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          echo "GOS_LLVM_OPT=$prefix/bin/opt" >> "$GITHUB_ENV"
          echo "GOS_LLC=$prefix/bin/llc"      >> "$GITHUB_ENV"
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-LlvmTool($name) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($dir in @('C:\msys64\mingw64\bin', 'C:\msys64\clang64\bin')) {
              $cand = Join-Path $dir $name
              if (Test-Path $cand) { return $cand }
            }
            return $null
          }
          $opt = Find-LlvmTool 'opt.exe'
          $llc = Find-LlvmTool 'llc.exe'
          if (-not $opt -or -not $llc) {
            & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed mingw-w64-x86_64-llvm
            $opt = Find-LlvmTool 'opt.exe'
            $llc = Find-LlvmTool 'llc.exe'
          }
          if (-not $opt -or -not $llc) { throw "opt.exe/llc.exe not found after MSYS2 install" }
          "GOS_LLVM_OPT=$opt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GOS_LLC=$llc"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-perf-native

      - name: Resolve cargo binary (shim guard)
        shell: bash
        run: |
          set -euo pipefail
          resolved_cargo="$("$HOME/.cargo/bin/rustup" which cargo)"
          echo "CARGO_BIN=$resolved_cargo" >> "$GITHUB_ENV"

      - name: Build release `gos`
        shell: bash
        run: |
          "$CARGO_BIN" build --release -p gossamer-cli

      - name: Build + time native binary
        shell: bash
        run: |
          set -euo pipefail
          GOS=./target/release/gos
          [ -x "$GOS" ] || GOS=./target/release/gos.exe
          SRC=examples/factorial.gos
          mkdir -p .perf
          rm -f .perf/native-current.txt

          # Build the native binary (the path this gate exists to cover).
          "$GOS" build --release "$SRC"
          BIN="$(find examples -type f \( -name factorial -o -name factorial.exe \) \
                  -newer "$SRC" 2>/dev/null | head -n1)"
          [ -n "$BIN" ] || { echo "native binary not produced for $SRC"; exit 1; }

          start=$(date +%s%N)
          "$BIN" >/dev/null 2>&1
          end=$(date +%s%N)
          echo "native_factorial $((end - start))" | tee -a .perf/native-current.txt

      - name: Hard wall-clock cap (10 s)
        shell: bash
        run: |
          set -euo pipefail
          awk '{ if ($2 > 10000000000) {
                   print "PERF ABORT: " $1 " took " int($2/1000000) "ms (> 10 s cap)"; exit 1 } }' \
            .perf/native-current.txt

      - name: Upload native perf log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-native-log-${{ matrix.os }}
          path: .perf/native-current.txt

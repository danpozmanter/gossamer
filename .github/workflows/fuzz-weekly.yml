name: Fuzz weekly

on:
  schedule:
    # Sunday 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fuzz harnesses link against libfuzzer, which uses its own
  # uninit-memory + ODR rules; the workspace `-D warnings` is too
  # strict for the libfuzzer-generated entry points.
  RUSTFLAGS: ""
  # See ci.yml for the full explanation. rustup proxies are not
  # concurrent-safe (rustup#988); RUSTUP_TOOLCHAIN suppresses the
  # rust-toolchain.toml override-file read in every proxy
  # invocation, eliminating the rust-src download race. cargo-fuzz
  # requires nightly; we pin a specific date so the build is
  # reproducible. Must match `toolchain:` on the dtolnay step and
  # the `+<toolchain>` flag on every cargo invocation below.
  RUSTUP_TOOLCHAIN: nightly-2026-04-14

permissions:
  contents: write
  pull-requests: write

jobs:
  fuzz-weekly:
    name: Fuzz weekly (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse, manifest, http_request, typecheck, mir_lower, vm_compile, resolve, hir_lower, vm_run]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-14
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-fuzz-weekly
          workspaces: fuzz
      # Install cargo-fuzz as a prebuilt binary (GitHub Releases via
      # cargo-binstall) - avoids compiling its full dependency tree
      # from crates.io on every cache miss.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for one hour
        working-directory: fuzz
        # `-fork=1` runs each batch of inputs in a child process so a
        # child that trips `-rss_limit_mb` / `-malloc_limit_mb` is
        # recorded as a crash artefact and replaced with a fresh child -
        # the parent survives the full hour instead of dying on one OOM.
        # An hour-long run accumulates allocator fragmentation that no
        # single input leaks (verified clean under LeakSanitizer); fork
        # isolation bounds that per child. The 2 GB caps keep a child
        # well under the runner's ~7 GB ceiling; `-timeout=30` caps
        # individual-input runtime so pathological inputs don't exhaust
        # the slot.
        # --target x86_64-unknown-linux-gnu: same rationale as fuzz.yml.
        run: |
          set -euo pipefail
          cargo +nightly-2026-04-14 fuzz run --target x86_64-unknown-linux-gnu \
            ${{ matrix.target }} \
            -- -fork=1 -max_total_time=3600 -max_len=65536 \
               -rss_limit_mb=2048 -malloc_limit_mb=2048 -timeout=30
      - name: Upload any crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}-weekly
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  # Audit M6: weekly corpus minimization. cargo fuzz cmin shrinks
  # the libFuzzer-grown corpus by removing inputs whose coverage
  # subsumes others'. We commit the minimised seed back via a PR
  # if and only if cmin produced fewer files than we started with -
  # silence is the no-op outcome.
  fuzz-cmin:
    name: Fuzz cmin (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse, manifest, http_request, typecheck, mir_lower, vm_compile, resolve, hir_lower, vm_run]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-14
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-fuzz-cmin
          workspaces: fuzz
      # Install cargo-fuzz as a prebuilt binary (GitHub Releases via
      # cargo-binstall) - avoids compiling its full dependency tree
      # from crates.io on every cache miss.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Minimise corpus
        working-directory: fuzz
        run: |
          set -euo pipefail
          before=$(find corpus/${{ matrix.target }} -type f 2>/dev/null | wc -l)
          cargo +nightly-2026-04-14 fuzz cmin --target x86_64-unknown-linux-gnu \
            ${{ matrix.target }} || true
          after=$(find corpus/${{ matrix.target }} -type f 2>/dev/null | wc -l)
          echo "corpus size: $before -> $after"
      - name: Open PR with minimised corpus
        uses: peter-evans/create-pull-request@v7
        with:
          title: "fuzz: cmin corpus for ${{ matrix.target }}"
          commit-message: "fuzz: cmin corpus for ${{ matrix.target }}"
          branch: fuzz-cmin/${{ matrix.target }}
          body: |
            Automated `cargo fuzz cmin` run for the
            `${{ matrix.target }}` target (audit M6).
          delete-branch: true

name: Fuzz smoke

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fuzz harnesses link against libfuzzer, which uses its own
  # uninit-memory + ODR rules; the workspace `-D warnings` is too
  # strict for the libfuzzer-generated entry points.
  RUSTFLAGS: ""

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse, manifest, http_request, typecheck, mir_lower, vm_compile, resolve, hir_lower, vm_run]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-fuzz
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Smoke each seed corpus for 30 s
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- -max_total_time=30 -max_len=65536
      - name: Upload any crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

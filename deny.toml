[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# Unmaintained-but-no-vulnerability advisories - pinned with the
# rationale here so a future bump can revisit. Active CVEs are NOT
# allowed here; they fail CI by design.
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Allow these to appear from several transitive graph depths. Each
# entry covers a base crate whose entire dependency subtree is
# version-fragmented by upstream churn we do not control. Skipping
# the subtree is cleaner than enumerating every pinned version.
skip-tree = [
    { name = "libc" },
    { name = "windows-sys" },
    # `nix` is single-versioned on Linux but `quinn-udp` can still pull
    # an older `nix` (plus its split `cfg_aliases` / `bitflags`) on
    # other targets, so keep the subtree skipped cross-platform.
    { name = "nix" },
    # `getrandom 0.2` / `0.3` / `0.4` arrive via rand_core 0.6 / 0.9
    # plus tempfile / uuid. The rand ecosystem hasn't consolidated
    # on a single major yet.
    { name = "rand_core" },
]
# Transitive duplicates we do not own the upgrade path for.
skip = [
    # The `cranelift 0.132` object/jit backend pulls newer `gimli`,
    # `hashbrown`, `object`, and an older `memmap2` than the rest of the
    # graph; each duplicate is confined to the cranelift subtree we do not
    # own the upgrade path for. Skip the version that only cranelift uses.
    { name = "gimli", version = "0.32.3" },
    { name = "hashbrown", version = "0.16.1" },
    { name = "object", version = "0.37.3" },
    { name = "memmap2", version = "0.2.3" },
    # `toml 0.9` is mid-migration off `winnow`: it pulls `winnow 0.7`
    # directly and `winnow 1.0` through `toml_parser`. Drop when toml
    # finishes the move to winnow 1.0.
    { name = "winnow", version = "0.7.15" },
    # `cpufeatures 0.2` reaches the workspace via sha2 / aes /
    # chacha20; `0.3` arrives via blake3. Both are RustCrypto deps.
    { name = "cpufeatures", version = "0.2.17" },
    # `socket2 0.5` vs `0.6` - quinn 0.11 pulls 0.5, h2 / rustls pull
    # 0.6. Drop the pin when quinn upgrades.
    { name = "socket2", version = "0.5.10" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
